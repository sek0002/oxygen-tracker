<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1424cc"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="O₂ Tracker"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="favicon.svg" type="image/svg+xml"><title>O₂ | Cylinder tracker</title><script src="theme.js"></script><link rel="stylesheet" href="styles.css"></head>
<body>
<section id="login" class="login"><form id="login-form" class="login-card"><div class="login-heading"><div class="brand-mark">O₂</div><button type="button" class="secondary theme-toggle" data-theme-toggle aria-label="Switch to dark mode" title="Dark mode">☾</button></div><h1>Cylinder tracker</h1><label for="pin">Access PIN</label><input id="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="current-password" required placeholder="••••"><button class="primary" type="submit">Unlock tracker <span>→</span></button><p id="login-error" class="error" role="alert"></p><button type="button" class="secondary install-button install-icon" data-install aria-label="Install app" title="Install app"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4"/><path d="M5 15v5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-5"/></svg></button></form></section>
<div id="app" hidden><header><a class="brand" href="./"><span class="brand-mark">O₂</span><span>Cylinder tracker</span></a><div class="summary"><div><span>Total Gas remaining</span><strong id="total">— <small>L</small></strong></div><div id="summary-left" class="summary-cylinder"></div><div id="summary-right" class="summary-cylinder"></div></div><div class="header-actions"><div class="storage"><span class="dot"></span><span id="storage-label">Connecting…</span></div><button type="button" class="secondary theme-toggle" data-theme-toggle aria-label="Switch to dark mode" title="Dark mode">☾</button><button type="button" class="secondary install-icon" data-install aria-label="Install app" title="Install app"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4"/><path d="M5 15v5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-5"/></svg></button><button id="lock" class="quiet lock-button" type="button" aria-label="Lock tracker" title="Lock tracker"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><path d="M12 14v3"/></svg></button></div></header>
<main>

<section id="cylinders" class="cylinders" aria-label="Cylinder readings"></section>
<section class="history"><div class="section-heading"><div><h2>Activity history</h2></div><button id="export" class="secondary">↓ Export text file</button></div><div class="history-controls"><div class="tabs" role="group" aria-label="Filter history"><button data-filter="all" class="active">All activity</button><button data-filter="left">Left cylinder</button><button data-filter="right">Right cylinder</button></div><span id="event-count"></span></div><div class="table-scroll"><table><thead><tr><th>Date & time</th><th>Cylinder</th><th>Activity</th><th>Pressure</th><th>Δ bar / L</th><th>Details</th></tr></thead><tbody id="history-body"></tbody></table></div><p id="empty-history" class="empty">No readings</p></section>
</main></div>
<dialog id="entry-dialog"><form id="entry-form"><div class="dialog-heading"><div><p class="eyebrow" id="dialog-side"></p><h2 id="dialog-title"></h2></div><button type="button" id="close-dialog" class="icon" aria-label="Close dialog">×</button></div><input id="entry-kind" type="hidden"><input id="entry-side" type="hidden"><label for="pressure">Current pressure <span>bar</span></label><input id="pressure" type="number" min="0" max="400" step="0.1" required><div id="replacement-fields"><label for="serial">Cylinder ID / serial <span>optional</span></label><input id="serial" maxlength="100" placeholder="e.g. G-0142"></div><label for="operator">Recorded by <span>optional</span></label><input id="operator" maxlength="100" placeholder="Your name"><label for="notes">Session / replacement notes <span>optional</span></label><textarea id="notes" rows="2" maxlength="1000" ></textarea><p id="estimate" class="estimate" aria-live="polite"></p><p id="entry-error" class="error" role="alert"></p><button id="save-entry" class="primary" type="submit">Save reading</button></form></dialog><div id="toast" role="status" hidden></div><dialog id="install-dialog"><div class="dialog-heading"><h2>Install app</h2><button id="close-install" class="icon" aria-label="Close installation help">×</button></div><p id="install-help"></p></dialog><script type="module" src="app.js"></script><script type="module" src="pwa.js"></script>
</body></html>
